<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 {
            text-align: center;
            color: #3730a3;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .stat {
            background: #eef2ff;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        .stat h2 {
            color: #4338ca;
            margin: 5px 0;
        }

        .stat p {
            margin: 0;
            color: #555;
        }

        #passage {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 18px;
            border-radius: 8px;
            line-height: 1.8;
            font-size: 17px;
        }

        #typingArea {
            width: 100%;
            height: 130px;
            margin-top: 15px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            resize: vertical;
        }

        #typingArea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            background: #4f46e5;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        #restart {
            background: #475569;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
            color: #15803d;
        }

        .correct {
            color: green;
        }

        .incorrect {
            color: red;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⌨️ Typing Speed Test</h1>
    <p style="text-align:center">
        Type the passage below as quickly and accurately as possible.
    </p>

    <div class="stats">
        <div class="stat">
            <p>Time Left</p>
            <h2 id="time">60</h2>
        </div>

        <div class="stat">
            <p>Speed (WPM)</p>
            <h2 id="wpm">0</h2>
        </div>

        <div class="stat">
            <p>Accuracy</p>
            <h2 id="accuracy">100%</h2>
        </div>
    </div>

    <h3>Type this passage:</h3>

    <div id="passage">
        <span id="referenceText">
            Learning programming improves logical thinking and problem
            solving skills. Practice every day to become a better developer.
        </span>
    </div>

    <textarea
        id="typingArea"
        placeholder="Click Start Test and begin typing here..."
        disabled
    ></textarea>

    <p>Errors: <strong id="errors">0</strong></p>

    <div class="buttons">
        <button id="start">Start Test</button>
        <button id="restart">Restart</button>
    </div>

    <div id="message"></div>

</div>

<script>
$(document).ready(function () {

    const originalText = $("#referenceText").text()
        .replace(/\s+/g, " ")
        .trim();

    let timeLeft = 60;
    let timer;
    let started = false;
    let finished = false;
    let startTime;

    function updateStats() {
        const typedText = $("#typingArea").val();
        const elapsedSeconds = Math.max(
            1,
            (Date.now() - startTime) / 1000
        );

        let correctChars = 0;
        let errors = 0;

        for (let i = 0; i < typedText.length; i++) {
            if (typedText[i] === originalText[i]) {
                correctChars++;
            } else {
                errors++;
            }
        }

        // Standard WPM calculation
        const minutes = elapsedSeconds / 60;
        const wpm = Math.round((typedText.length / 5) / minutes);

        // Accuracy is based on characters typed
        const accuracy = typedText.length === 0
            ? 100
            : Math.round((correctChars / typedText.length) * 100);

        $("#wpm").text(wpm);
        $("#accuracy").text(accuracy + "%");
        $("#errors").text(errors);
    }

    function finishTest() {
        clearInterval(timer);
        finished = true;

        $("#typingArea").prop("disabled", true);
        $("#start").prop("disabled", true);

        updateStats();

        $("#message").text(
            "Test completed! Your final speed is " +
            $("#wpm").text() + " WPM."
        );
    }

    function startTest() {
        if (started) return;

        started = true;
        startTime = Date.now();

        $("#typingArea").prop("disabled", false).focus();
        $("#start").prop("disabled", true);
        $("#message").text("Start typing!");

        timer = setInterval(function () {
            timeLeft--;
            $("#time").text(timeLeft);

            if (timeLeft <= 0) {
                finishTest();
            }
        }, 1000);
    }

    $("#start").on("click", startTest);

    $("#typingArea").on("input", function () {
        if (!started || finished) return;

        updateStats();

        if ($(this).val().length >= originalText.length) {
            finishTest();
        }
    });

    $("#restart").on("click", function () {
        clearInterval(timer);

        timeLeft = 60;
        started = false;
        finished = false;

        $("#time").text(60);
        $("#wpm").text(0);
        $("#accuracy").text("100%");
        $("#errors").text(0);
        $("#typingArea").val("").prop("disabled", true);
        $("#start").prop("disabled", false);
        $("#message").text("");
    });

});
</script>

</body>
</html>
